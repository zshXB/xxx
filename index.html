<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Browser</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #121214;
      color: #a1a1aa;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #1c1c1f;
      border-bottom: 1px solid #27272a;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #27272a;
      color: #d4d4d8;
      cursor: pointer;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #27272a;
      background: #121214;
      color: #e4e4e7;
      outline: none;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reloadPage()">↻</button>
    <input id="urlInput" type="text" placeholder="Ketik URL (misal: wikipedia.org)" onkeydown="if(event.key==='Enter') loadUrl()" />
    <button onclick="loadUrl()">Go</button>
  </div>
  <iframe id="viewer" src="https://id.m.wikipedia.org"></iframe>

  <script>
    const viewer = document.getElementById('viewer');
    const urlInput = document.getElementById('urlInput');

    function normalizeUrl(raw) {
      let url = raw.trim();
      if (!url) return '';
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      return url;
    }

    function loadUrl() {
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      viewer.src = url;
    }

    function goBack() {
      try { viewer.contentWindow.history.back(); } catch (e) {}
    }

    function goForward() {
      try { viewer.contentWindow.history.forward(); } catch (e) {}
    }

    function reloadPage() {
      viewer.src = viewer.src;
    }
  </script>
</body>
</html>
